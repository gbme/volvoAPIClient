---
# Python-pakketten bijwerken: python3/python3-venv via apt en de pip-afhankelijkheden van de
# actieve release in de venv (laatste versies binnen requirements.txt). Daarna één run.
- name: Bijwerken
  hosts: volvo_api_client
  become: true

  tasks:
    - name: Python via apt
      ansible.builtin.apt:
        name: [python3, python3-venv]
        state: latest
        update_cache: true

    - name: Afhankelijkheden in de venv
      ansible.builtin.pip:
        requirements: "{{ app_current }}/requirements.txt"
        virtualenv: "{{ app_venv }}"
        virtualenv_command: python3 -m venv
        state: latest
      become_user: "{{ ansible_user }}"

    - name: Controle
      ansible.builtin.include_tasks: tasks/health.yml
